    directory: C:\ProgramData\chocolatey\lib\dnspy\tools\

- name: Create 'Ghidra' shortcut
  win_shortcut:
    src: C:\ProgramData\chocolatey\lib\ghidra\tools\ghidra_12.0.1_PUBLIC\ghidraRun.bat
