- name: Create 'IDA64' shortcut
  win_shortcut:
    src: 'C:\Program Files\IDA Freeware 8.3\ida64.exe'
    dest: C:\Tools\RE\ida64.lnk
    description: "Shortcut to the IDA64 application"
    directory: C:\Program Files\IDA Freeware 8.3\
  ignore_errors: yes
  # Ignore errors because the directory might change name in the future

