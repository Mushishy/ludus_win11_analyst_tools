---
# Tools\Detect shortcuts
- name: Copy PeSieve into the detect directory
  win_copy:
    src: "C:\\ProgramData\\chocolatey\\lib\\pesieve\\tools\\pe-sieve.exe"
    dest: "C:\\Tools\\Detect\\pe-sieve.exe"
    remote_src: yes
    
# Tools\RE shortcuts  
- name: Create 'capa' shortcut
  win_shortcut:
    src: C:\ProgramData\chocolatey\lib\capa\tools\capa.exe
    dest: C:\Tools\RE\capa.lnk
    description: "Shortcut to the capa application"
    directory: C:\ProgramData\chocolatey\lib\capa\tools\

- name: Create 'dnSpy' shortcut
  win_shortcut:
    src: C:\ProgramData\chocolatey\lib\dnspy\tools\dnSpy.exe
