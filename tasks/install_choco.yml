---
- name: Install chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name:
      - chocolatey

- name: Install chocolatey packages
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item }}"
    state: present
    source: "{{ chocolatey_source | default('') }}"
    ignore_checksums: true
  loop:
    - vscode
    - git
    - 7zip
    - python3
    - sysinternals
    - osquery
    - exiftool
    - pebear
    - pestudio
    - pesieve
    - die
    - explorersuite
    - capa
    - upx
    - ida-free
    - ghidra
    - dnspy
    - cyberchef
    - hxd
    - volatility
    - processhacker
    - reshack
    - regshot
    - x64dbg.portable
    - apimonitor
    - javadecompiler-gui
    - apktool
    #- threadtear-gui
    #- malcat
    #- vbindiff
    - ffmpeg
